<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertama Saya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117; /* Warna latar gelap elegan */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        h1 {
            color: #ffffff;
            margin-top: 20px;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SESUAIKAN nama file gambar di bawah ini -->
        <img src="gambar-webutama.jpg.jpeg" alt="Gambar Utama Halaman Web">
        <h1>Selamat Datang di Website Pertama Saya!</h1>
    </div>

</body>
</html>
